# Everything the app needs locally. The mocks use the same stub files as the integration tests.
services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: docviewer
      POSTGRES_USER: docviewer
      POSTGRES_PASSWORD: docviewer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U docviewer -d docviewer"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The WireMock image has its own health check on /__admin/health
  sales-api:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8081:8080"
    volumes:
      - ./mocks/sales:/home/wiremock:ro

  service-api:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8082:8080"
    volumes:
      - ./mocks/service:/home/wiremock:ro

  # Scrapes the app, which runs on the host at port 8080
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # local only, so the dashboard opens without a login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Receives the app's traces over OTLP on 4318. The UI is on 16686
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"
      - "4318:4318"
