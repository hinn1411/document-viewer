<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Application architecture: a browser uses Swagger UI to call the Spring Boot app on the host. The app calls the two WireMock source APIs in parallel, stores audit rows and fallback copies in PostgreSQL, and pushes traces to Jaeger. Prometheus scrapes the app's metrics and Grafana queries Prometheus. All services except the app run in Docker Compose">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 16px; fill: #475569; }
    .group { font-size: 18px; font-weight: 700; fill: #475569; text-anchor: start; }
    .edge { font-size: 15px; fill: #475569; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    .ours { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .mock { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; }
    .data { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .obs { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .frame { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
  </style>

  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- Browser -->
  <rect class="mock" x="10" y="245" width="130" height="80" rx="10"/>
  <text class="title" x="75" y="280">Browser</text>
  <text class="sub" x="75" y="305">Swagger UI</text>

  <!-- The app, on the host -->
  <rect class="ours" x="240" y="60" width="220" height="457" rx="12"/>
  <text class="title" x="350" y="280">Spring Boot</text>
  <text class="sub" x="350" y="306">API server · :8080</text>

  <!-- Docker Compose -->
  <rect class="frame" x="690" y="20" width="490" height="520" rx="14"/>
  <text class="group" x="708" y="46">Docker Compose</text>

  <rect class="mock" x="712" y="60" width="210" height="72" rx="10"/>
  <text class="title" x="817" y="92">WireMock</text>
  <text class="sub" x="817" y="116">JSON server · :8081</text>

  <rect class="mock" x="712" y="150" width="210" height="72" rx="10"/>
  <text class="title" x="817" y="182">WireMock</text>
  <text class="sub" x="817" y="206">JSON server · :8082</text>

  <rect class="data" x="712" y="240" width="210" height="72" rx="10"/>
  <text class="title" x="817" y="272">PostgreSQL</text>
  <text class="sub" x="817" y="296">server :5432</text>

  <rect class="obs" x="712" y="350" width="210" height="72" rx="10"/>
  <text class="title" x="817" y="382">Jaeger</text>
  <text class="sub" x="817" y="406">UI :16686</text>

  <rect class="obs" x="712" y="445" width="210" height="72" rx="10"/>
  <text class="title" x="817" y="477">Prometheus</text>
  <text class="sub" x="817" y="501">dashboard :9090</text>

  <rect class="obs" x="985" y="445" width="190" height="72" rx="10"/>
  <text class="title" x="1080" y="477">Grafana</text>
  <text class="sub" x="1080" y="501">dashboard :3000</text>

  <!-- Edges -->
  <path class="line" d="M140 285 H238"/>
  <text class="edge" x="189" y="275">HTTP</text>

  <path class="line" d="M460 96 H710"/>
  <path class="line" d="M460 186 H710"/>

  <path class="line" d="M460 276 H710"/>

  <path class="line" d="M460 386 H710"/>
  <text class="edge" x="585" y="376">Push traces</text>

  <path class="line" d="M712 481 H462"/>
  <text class="edge" x="585" y="471">Pull metrics</text>
  <text class="edge" x="585" y="503">Every 15s</text>

  <path class="line" d="M985 481 H924"/>
  <text class="edge" x="954" y="471">Query</text>
</svg>
