<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="The AI-native TDD loop: frame, red, human review of the tests, green, review agent, refactor, log mistakes, pull request, CI with lint, build, unit tests, integration tests and Claude review, then manual review">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 16px; fill: #475569; }
    .mono { font-family: Consolas, Menlo, monospace; font-size: 16px; }
    .item { font-size: 18px; }
    .group { font-size: 18px; font-weight: 700; fill: #475569; text-anchor: start; }
    .edge { font-size: 16px; fill: #b45309; font-weight: 700; }
    .green { font-size: 15px; fill: #15803d; font-weight: 700; }
    .legend { font-size: 17px; text-anchor: start; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    .back { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    .agent { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .human { fill: #fef3c7; stroke: #b45309; stroke-width: 3; }
    .auto { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .frame { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
  </style>

  <rect width="1200" height="600" fill="#ffffff"/>

  <!-- Row 1: tests first -->
  <rect class="human" x="30" y="50" width="190" height="80" rx="10"/>
  <text class="title" x="125" y="84">1. Frame</text>
  <text class="mono" x="125" y="110">/frame-task</text>

  <rect class="agent" x="265" y="50" width="190" height="80" rx="10"/>
  <text class="title" x="360" y="84">2. Red</text>
  <text class="sub" x="360" y="110">Failing tests</text>

  <rect class="human" x="500" y="50" width="190" height="80" rx="10"/>
  <text class="title" x="595" y="84">3. I review</text>
  <text class="sub" x="595" y="110">the tests</text>

  <rect class="agent" x="735" y="50" width="190" height="80" rx="10"/>
  <text class="title" x="830" y="84">4. Green</text>
  <text class="sub" x="830" y="110">Simplest code</text>

  <rect class="agent" x="970" y="50" width="200" height="80" rx="10"/>
  <text class="title" x="1070" y="84">5. Review agent</text>
  <text class="mono" x="1070" y="110">code-reviewer</text>

  <path class="line" d="M220 90 H263"/>
  <path class="line" d="M455 90 H498"/>
  <path class="line" d="M690 90 H733"/>
  <path class="line" d="M925 90 H968"/>
  <path class="back" d="M595 50 V22 H360 V48"/>
  <text class="edge" x="478" y="16">change</text>

  <path class="line" d="M1070 130 V160 H125 V188"/>

  <!-- Row 2: tidy up and open the PR -->
  <rect class="agent" x="30" y="190" width="190" height="80" rx="10"/>
  <text class="title" x="125" y="224">6. Refactor</text>
  <text class="sub" x="125" y="250">Tests stay green</text>

  <rect class="agent" x="265" y="190" width="190" height="80" rx="10"/>
  <text class="title" x="360" y="224">7. Log mistakes</text>
  <text class="mono" x="360" y="250">ai-log.md</text>

  <rect class="agent" x="500" y="190" width="190" height="80" rx="10"/>
  <text class="title" x="595" y="224">8. PR</text>
  <text class="sub" x="595" y="250">Opened</text>

  <path class="line" d="M220 230 H263"/>
  <path class="line" d="M455 230 H498"/>
  <path class="line" d="M595 270 V313"/>

  <!-- Legend -->
  <rect class="human" x="770" y="192" width="26" height="22" rx="4"/>
  <text class="legend" x="808" y="209">I decide</text>
  <rect class="agent" x="770" y="224" width="26" height="22" rx="4"/>
  <text class="legend" x="808" y="241">The AI agent works</text>
  <rect class="auto" x="770" y="256" width="26" height="22" rx="4"/>
  <text class="legend" x="808" y="273">Automated, on every PR</text>

  <!-- Row 3: CI, then me -->
  <rect class="frame" x="30" y="315" width="875" height="130" rx="12"/>
  <text class="group" x="48" y="342">9. CI</text>
  <text class="green" x="682" y="342">only when green</text>

  <rect class="auto" x="48" y="355" width="125" height="72" rx="8"/>
  <text class="title" x="110" y="398">Lint</text>
  <rect class="auto" x="198" y="355" width="125" height="72" rx="8"/>
  <text class="title" x="260" y="398">Build</text>
  <rect class="auto" x="348" y="355" width="125" height="72" rx="8"/>
  <text class="title" x="410" y="385">Unit</text>
  <text class="sub" x="410" y="409">tests</text>
  <rect class="auto" x="498" y="355" width="150" height="72" rx="8"/>
  <text class="title" x="573" y="385">Integration</text>
  <text class="sub" x="573" y="409">tests</text>
  <rect class="auto" x="717" y="355" width="170" height="72" rx="8"/>
  <text class="title" x="802" y="385">Claude review</text>
  <text class="sub" x="802" y="409">Bot comments on PR</text>

  <path class="line" d="M173 391 H196"/>
  <path class="line" d="M323 391 H346"/>
  <path class="line" d="M473 391 H496"/>
  <path class="line" d="M648 391 H715"/>

  <rect class="human" x="975" y="340" width="195" height="80" rx="10"/>
  <text class="title" x="1072" y="385">10. Manual review</text>
  <path class="line" d="M905 380 H973"/>

  <!-- Constraints -->
  <rect class="frame" x="30" y="475" width="1140" height="105" rx="12"/>
  <text class="group" x="50" y="503">Constraints on the agent at every step</text>
  <text class="mono" x="170" y="550">CLAUDE.md</text>
  <text class="mono" x="400" y="550">.claude/rules/</text>
  <text class="item" x="620" y="550">Hooks</text>
  <text class="item" x="820" y="550">Plan mode</text>
  <text class="item" x="1030" y="550">Context7</text>
</svg>
