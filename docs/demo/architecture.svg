<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="System architecture: a mocked client calls the stateless Document Viewer Service, whose Search Service calls the mocked Sales and Service systems in parallel through one adapter each, and stores the audit log and fallback copies in a database through repositories">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
    .title { font-size: 21px; font-weight: 700; }
    .sub { font-size: 17px; fill: #475569; }
    .group { font-size: 18px; font-weight: 700; fill: #475569; text-anchor: start; }
    .edge { font-size: 16px; fill: #475569; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    .ours { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .mock { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; }
    .data { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .frame { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
  </style>

  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- Client -->
  <rect class="mock" x="30" y="220" width="190" height="80" rx="10"/>
  <text class="title" x="125" y="267">Client (mocked)</text>

  <!-- Service -->
  <rect class="frame" x="290" y="20" width="550" height="520" rx="14"/>
  <text class="group" x="310" y="52">Document Viewer Service (stateless)</text>

  <rect class="ours" x="320" y="70" width="490" height="70" rx="10"/>
  <text class="title" x="565" y="100">API layer</text>
  <text class="sub" x="565" y="125">Check client identity and VIN</text>

  <rect class="ours" x="320" y="175" width="490" height="80" rx="10"/>
  <text class="title" x="565" y="208">Search Service</text>
  <text class="sub" x="565" y="235">Calls the sources, merges the results, audits access</text>

  <rect class="ours" x="320" y="320" width="235" height="70" rx="10"/>
  <text class="title" x="437" y="362">Sales adapter</text>

  <rect class="ours" x="575" y="320" width="235" height="70" rx="10"/>
  <text class="title" x="692" y="362">Service adapter</text>

  <rect class="ours" x="320" y="450" width="490" height="70" rx="10"/>
  <text class="title" x="565" y="492">Repositories</text>

  <!-- Sources and database -->
  <rect class="mock" x="930" y="60" width="240" height="90" rx="10"/>
  <text class="title" x="1050" y="98">Service System API</text>
  <text class="sub" x="1050" y="124">Mocked</text>

  <rect class="mock" x="930" y="225" width="240" height="90" rx="10"/>
  <text class="title" x="1050" y="263">Sales System API</text>
  <text class="sub" x="1050" y="289">Mocked</text>

  <rect class="data" x="930" y="440" width="240" height="90" rx="10"/>
  <text class="title" x="1050" y="478">DB</text>
  <text class="sub" x="1050" y="504">Audit log and fallback copies</text>

  <!-- Edges -->
  <path class="line" d="M220 260 H255 V105 H318"/>
  <path class="line" d="M565 140 V173"/>
  <path class="line" d="M437 255 V318"/>
  <path class="line" d="M692 255 V318"/>
  <text class="edge" x="565" y="292">in parallel</text>
  <path class="line" d="M320 225 H303 V485 H318"/>
  <path class="line" d="M437 390 V420 H870 V270 H928"/>
  <path class="line" d="M810 355 H850 V105 H928"/>
  <path class="line" d="M810 485 H928"/>
</svg>
