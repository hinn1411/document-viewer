spring:
  application:
    name: document-viewer
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/docviewer
    username: docviewer
    password: docviewer
    hikari:
      connection-timeout: 1000 # ms. With the database down, fail fast: the audit can't be saved anyway
      data-source-properties:
        socketTimeout: 2 # seconds. A stalled query fails, so the audit fails closed

docviewer:
  source-deadline: 2s # per source, then TIMEOUT
  fallback-max-age: 24h # older snapshots are not served, and are deleted
  dealership-zone: Europe/London # for date-only values such as the Sales createdOn
  circuit-breaker: # per source and per instance. Starting values, to tune from T13's metrics
    window: 60s # time-based, so old failures expire at low traffic
    minimum-calls: 10 # fewer calls than this in the window never opens it
    failure-rate: 50 # percent
    slow-call: 1500ms # a healthy source answers in about 500 ms (A9)
    slow-call-rate: 50 # percent
    open-for: 30s
    half-open-calls: 3
    half-open-max-wait: 60s # then back to open, even if trial calls succeeded
  sources:
    sales:
      base-url: http://localhost:8081
      connect-timeout: 300ms
      read-timeout: 1500ms
    service:
      base-url: http://localhost:8082
      connect-timeout: 300ms
      read-timeout: 1500ms

logging:
  structured:
    format:
      console: logstash # one JSON object per line, with flat level and trace fields

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  otlp:
    metrics:
      export:
        enabled: false # metrics are scraped by Prometheus; Jaeger on 4318 takes traces only
  tracing:
    sampling:
      probability: 1.0 # every request locally; production sampling is a collector concern
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces # Jaeger in Docker Compose
