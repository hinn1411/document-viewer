name: ci

on:
  pull_request:
    # ready_for_review: a PR leaving draft gets its first Claude review
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its running build and review
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Format, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Format check
        run: ./mvnw -B spotless:check

      # Unit tests (surefire) and *IT tests (failsafe) with Testcontainers PostgreSQL and WireMock
      - name: Build, unit and integration tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  # Advisory, not a required check: runs only when the build is green on a non-draft PR from this repo
  # (fork PRs get no secrets). The action's OIDC exchange needs this file to match main, so a PR that
  # changes ci.yml gets a failed review job until it merges.
  review:
    name: Claude review
    needs: build
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Each review replaces the last one: remove Claude's earlier inline comments, keep everyone else's
      - name: Delete earlier Claude comments
        shell: bash # adds pipefail, so a failed listing fails the step
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$REPO/pulls/comments/$id"
            done

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Don't edit files or push.
            1. Read the diff with `gh pr diff`.
            2. Check it against CLAUDE.md and docs/system-design-document.md
               (parallel source calls with a 2 s deadline, one retry, fallback, audit, HTTP codes in §4.2,
               no full VINs or document content in logs).
            3. If the PR names a task (Txx), read docs/plans/briefs/Txx.md and check that each
               "Done when" item has a test and that the tests weren't weakened.
            4. Post each concrete issue as an inline comment with a suggested fix. No summary comment.
               Skip formatting: Spotless enforces it.
